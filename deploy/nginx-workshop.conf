# 创意工坊 nginx 反代样例
# 用法：改 server_name（或保持 _）→ 丢进 /etc/nginx/conf.d/workshop.conf
#      nginx -t && systemctl reload nginx
# 前提：net.py 由 deploy_workshop.py 装成 systemd 服务，监听 127.0.0.1:5000。
#      这时 WORKSHOP_HOST 必须是 127.0.0.1（别再让 5000 对外暴露）。

# 限流（可选）：同一 IP 每分钟最多 60 次写请求，防扫
limit_req_zone $binary_remote_addr zone=ws_write:10m rate=60r/m;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # 与 WORKSHOP_UPLOAD_MAX_MB=64 对齐；小了会在 nginx 那层直接 413
    client_max_body_size 64m;
    client_body_timeout 120s;

    access_log /var/log/nginx/dick-workshop.access.log;
    error_log  /var/log/nginx/dick-workshop.error.log warn;

    # 探活不吃限流
    location = /api/health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 分片上传：不要整包缓存在 nginx 里，也别关掉请求体转发
        proxy_request_buffering off;

        # 大包 + 慢网：读超时给足（下载卡包/世界卡可能很慢）
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # 写操作（上传/删除/点赞/进度）限流，读不限
        limit_req zone=ws_write burst=30 nodelay;
    }

    # 想让别人只能用 https？加 443 + certbot，然后把 8080 这段改成跳转
    # return 301 https://$host$request_uri;
}
