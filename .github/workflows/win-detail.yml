name: win-detail

# 只为拿到 test_block_portability 在 Windows 上的**失败行**。
# 关键：注解里不要放 %0A 和中文（之前 ::error 带 %0A+CJK 会被 GitHub 丢掉，
# 而纯 ::notice 是能显示的），所以这里只发 ASCII 单行。

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/win-detail.yml'
  workflow_dispatch:

jobs:
  detail:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: deps
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-test.txt
      - name: run-and-report
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python tests/test_block_portability.py > /tmp/out.txt 2>&1 || true
          echo "--- tail (log only) ---"
          tail -n 12 /tmp/out.txt
          # 只发 ASCII 单行注解：FAIL 行 + 最后一行
          FAILS="$(grep -a '\[FAIL\]' /tmp/out.txt | head -n 3 | tr -d '\r' | sed 's/[^ -~]/?/g' | cut -c1-90 | tr '\n' ' ')"
          LAST="$(tail -n 1 /tmp/out.txt | tr -d '\r' | sed 's/[^ -~]/?/g' | cut -c1-80)"
          echo "::error::FAILS=[$FAILS] LAST=[$LAST]"
          python - <<'PY'
          import re
          s = open('/tmp/out.txt', encoding='utf-8', errors='replace').read()
          m = re.findall(r'\[FAIL\][^\n]*', s)
          print("FAIL lines:", len(m))
          for x in m[:5]:
              print("  ", x[:160])
          PY
