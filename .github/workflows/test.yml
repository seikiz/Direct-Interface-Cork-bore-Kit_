# GitHub Actions —— DICK 全量测试矩阵（商业化质量的测试纪律）
# 每次 push / PR 跑一遍全套测试，防回归；失败即红。
#
# 2026-10 复盘（两次，共六个真问题）：
#   ① 连续 6 次"全红"其实只有一类原因 —— requirements-test.txt 少了
#      cryptography / numpy / python-docx，五个脚本 ModuleNotFoundError（本机有、CI 没有）。
#      唯一那条 Node 相关输出是**警告**（actions 跑在 Node 24 上，Node 20 已弃用），不是失败。
#   ② 补齐依赖后又冒出四个"Linux 才炸"的：工程根的测试桩被 .gitignore 忽略、
#      测试依赖用户运行时文件、写死 Windows 发布包路径、以及一个真 bug
#      （save_guard 的后台清理会删掉正在写入的临时文件 → Linux 上 os.replace ENOENT）。
#   ③ 反方向也有：Windows 独有的 GBK 坑（协议插件子进程漏配 stdin）Linux 看不见。
# 所以现在：
#   · 两个作业：linux（3.11/3.12 矩阵）+ windows（单版本）—— 平台差异两边都盯
#   · 失败脚本的 [FAIL] 行与末尾几行打成 ::error 注解（job 日志 API 要 admin，注解不用）
#   · 图标回归（Node）那步 if: always()：Python 挂了它也照跑，"Node 有没有事"一眼可辨
name: test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: linux (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: |
          set -o pipefail
          echo "::notice::python=$(command -v python) $(python -VV 2>&1 | head -1)"
          LOG="${RUNNER_TEMP:-/tmp}/pip.log"
          if ! python -m pip install --upgrade pip > "$LOG" 2>&1; then
            echo "::error::pip 自升级失败%0A$(tail -n 8 "$LOG" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "::notice::pip 升级完成：$(python -m pip --version)"
          if ! python -m pip install -r requirements-test.txt > "$LOG" 2>&1; then
            echo "::error::依赖安装失败（requirements-test.txt）%0A$(grep -iE 'error|no matching|could not find|failed' "$LOG" | tail -n 12 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "::notice::requirements-test.txt 装完"
          # 自检放进脚本（tools/ci_dep_check.py）：内联 python -c 一旦自己抛异常，
          # 就既没有 notice 也没有 error，注解区只剩"exit code 1" —— 白红一次。
          python tools/ci_dep_check.py --github

      - name: 环境报告（贴日志里，省得以后猜"CI 上是什么环境"）
        run: python tools/env_report.py

      - name: 运行全量测试
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          FAIL=0
          FAILED=""
          for t in tests/test_*.py; do
            echo "== $t =="
            LOG="$(mktemp)"
            if ! python "$t" 2>&1 | tee "$LOG"; then
              FAIL=1
              FAILED="$FAILED $t"
              # 注解里放"失败断言行 + 末尾几行"：失败断言行说明**哪一条**红了，
              # 末尾几行给上下文（异常栈/统计）。都做转义（% → %25，换行 → %0A）。
              FAILS="$(grep -m 6 '\[FAIL\]' "$LOG" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
              TAIL="$(tail -n 6 "$LOG" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
              echo "::error file=$t::$(basename "$t") 失败：%0A$FAILS%0A--- 末尾 ---%0A$TAIL"
            fi
            rm -f "$LOG"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::失败的脚本：$FAILED"
          fi
          exit $FAIL

      - name: 汇总
        if: always()
        run: echo "测试结束（检查上方是否有 FAIL）"

      # 图标系统是纯前端逻辑，Python 套件扫不到它 —— 之前它红了很久没人发现。
      # 只依赖 Node（runner 自带），不用装任何包。
      # if: always()：Python 那步挂了也要跑 —— 否则"Node 到底有没有事"永远看不出来
      # （2026-10 那几次红灯里，这一步一直是 skipped，却被人当成 Node 的问题）。
      - name: 图标系统回归（Node）
        if: always()
        run: |
          node --version
          node tests/test_icons.js

  # 反方向的护栏：Windows 独有的坑（GBK/stdin 编码、路径大小写、DPAPI 行为）
  # 在 Linux 上永远看不见 —— 2026-10 就漏过一个：协议插件子进程没配 stdin 编码，
  # 中文消息被按 GBK 解成乱码，只有 Windows 会炸。
  # 用 shell: bash（runner 自带 Git Bash），与 linux 作业跑**同一段脚本**，避免两套逻辑漂移。
  windows:
    name: windows (py3.12)
    runs-on: windows-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装测试依赖
        shell: bash
        run: |
          set -o pipefail
          echo "::notice::python=$(command -v python) $(python -VV 2>&1 | head -1) RUNNER_TEMP=${RUNNER_TEMP:-<未设置>}"
          LOG="${RUNNER_TEMP:-/tmp}/pip.log"
          # 每个里程碑都发一条 ::notice::，失败时把 pip 的错误行发成 ::error::
          # 为什么要这样：job 日志要仓库 admin 权限（API 403），注解不用登录就能读。
          # 2026-10 windows 作业在这步红过两次，而看日志没权限 —— 只能靠注解自己说清
          # "走到哪一步、缺哪个包、pip 报了什么"。
          if ! python -m pip install --upgrade pip > "$LOG" 2>&1; then
            echo "::error::pip 自升级失败%0A$(tail -n 8 "$LOG" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "::notice::pip 升级完成：$(python -m pip --version)"
          if ! python -m pip install -r requirements-test.txt > "$LOG" 2>&1; then
            echo "::error::依赖安装失败（requirements-test.txt）%0A$(grep -iE 'error|no matching|could not find|failed' "$LOG" | tail -n 12 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "::notice::requirements-test.txt 装完：$(grep -c . "$LOG") 行输出"
          # 自检放进脚本（tools/ci_dep_check.py）：内联 python -c 自己抛异常时
          # 既没有 notice 也没有 error，注解区只剩"exit code 1" —— 2026-10 就这么白红过。
          python tools/ci_dep_check.py --github

      - name: 环境报告
        shell: bash
        run: python tools/env_report.py

      - name: 运行全量测试
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          FAIL=0
          FAILED=""
          for t in tests/test_*.py; do
            echo "== $t =="
            LOG="$(mktemp)"
            if ! python "$t" 2>&1 | tee "$LOG"; then
              FAIL=1
              FAILED="$FAILED $t"
              FAILS="$(grep -m 6 '\[FAIL\]' "$LOG" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
              TAIL="$(tail -n 6 "$LOG" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
              echo "::error file=$t::$(basename "$t") 失败：%0A$FAILS%0A--- 末尾 ---%0A$TAIL"
            fi
            rm -f "$LOG"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::失败的脚本：$FAILED"
          fi
          exit $FAIL

      - name: 汇总
        if: always()
        run: echo "测试结束（检查上方是否有 FAIL）"

      # Windows 也跑一遍图标回归：它读 web/index.html 与 Android drawable，
      # 顺便验证"在 Windows 的换行/编码下，那套解析不炸"。
      - name: 图标系统回归（Node）
        if: always()
        run: |
          node --version
          node tests/test_icons.js
