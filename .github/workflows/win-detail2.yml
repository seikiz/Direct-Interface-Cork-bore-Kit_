name: win-detail2

# 用 **::notice** 把失败行发出来。
# 依据：之前 `::notice::`（纯 ASCII、单行）确实出现在 annotations 里，
# 而带 %0A / 中文的 `::error::` 从来没出现过。注解额度 10 条，我们只发 ≤6 条。

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/win-detail2.yml'
  workflow_dispatch:

jobs:
  detail:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: deps
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-test.txt
      - name: notice-report
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # GitHub 用 bash -e 跑：不加 || true，测试一非零就立刻中断，
          # 后面的 ::notice 一条都发不出来（前两次白跑的真因）。
          python tests/test_block_portability.py > /tmp/out.txt 2>&1 || true
          RC=0
          echo "exit=$RC"
          echo "::notice::RC=$RC LINES=$(wc -l < /tmp/out.txt)"
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            if [ "$n" -gt 6 ]; then break; fi
            clean="$(printf '%s' "$line" | tr -d '\r' | sed 's/[^ -~]/?/g' | cut -c1-110)"
            echo "::notice::F$n $clean"
          done < <(grep -a '\[FAIL\]' /tmp/out.txt || true)
          last="$(tail -n 1 /tmp/out.txt | tr -d '\r' | sed 's/[^ -~]/?/g' | cut -c1-110)"
          echo "::notice::LAST $last"
