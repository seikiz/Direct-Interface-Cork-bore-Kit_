<!-- 头像裁<seiki>‌​‌​‌​‍‌‌​​‎‌​‍‎‌‌‎‎‌​​‎‌​‎‎‌​‌​‌​‌‌‌‌‍​‌‌‎‎‌‌​‎‌​‍‌‌​‌‎‌‌‎‎​‎‌‎‌‍‌‍​‎​‎‌‍​‌​‎‍‌‌‍​‎​‎​‍‌‍‌‌剪模态 -->
<div class="modal" id="cropModal">
  <div class="modal-box" style="width:420px">
    <h3>✂️ 裁剪头像</h3>
    <div style="position:relative;width:360px;height:360px;margin:10px auto;overflow:hidden;background:#111;border-radius:8px" id="cropStage">
      <img id="cropImg" style="position:absolute;max-width:none;user-select:none;cursor:move" draggable="false">
      <div id="cropOverlay" style="position:absolute;inset:0;pointer-events:none">
        <div style="position:absolute;left:50%;top:50%;width:200px;height:200px;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55)"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:0 20px">
      <span style="font-size:12px;color:var(--sub)">缩放</span>
      <input type="range" id="cropZoom" min="50" max="300" value="100" style="flex:1">
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;padding:10px 20px">
      <button class="btn2 ghost" id="cropCancelBtn">取消</button>
      <button class="btn2" id="cropOkBtn">✅ 确认</button>
    </div>
  </div>
</div>
