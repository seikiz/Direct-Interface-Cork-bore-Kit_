<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哥特 · 简洁 / 极繁 / 大教堂 / 满溢(压力)</title>
<style>
  body{margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; background:#04030a;}
  .bar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; justify-content:center;}
  .bar button{border:1px solid #4a3760; background:#14101f; color:#e8d9b0; padding:8px 14px; border-radius:6px; cursor:pointer; font-family:inherit;}
  .bar button.on{border-color:#c9a227; color:#e9cf7a; box-shadow:0 0 10px rgba(201,162,39,.35);}
  iframe.demo{border:0; width:min(720px,100%); height:86vh; background:transparent;}
</style>
</head>
<body>
<div class="bar">
  <button id="bSimple">📜 简洁</button>
  <button id="bMax">🦇 极繁</button>
  <button id="bCathedral">⛪ 大教堂</button>
  <button id="bMega" class="on">🔥 满溢(压力)</button>
  <button id="bBlend">💀 糅合(位图)</button>
</div>
<iframe class="demo" id="demoFrame"></iframe>
<script>
  var PAL = [':root{--g-gold:#c9a227;--g-gold2:#e9cf7a;--g-violet:#6b4a86;--g-violet2:#8a63b8;--g-text:#e8d9b0;--g-dim:#a89a78;--g-blue:#3b4a86;--g-crimson:#8a2f45;}',
    '*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}',
    '.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;font-family:Georgia,"Times New Roman","Noto Serif SC",serif;background:radial-gradient(ellipse at 50% 0%,#12101c 0%,#060409 70%);}',
    '@keyframes gIn{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}',
    '@keyframes gGlow{0%,100%{box-shadow:0 0 40px rgba(107,74,134,.45),inset 0 0 26px rgba(0,0,0,.66);}50%{box-shadow:0 0 62px rgba(139,99,184,.60),inset 0 0 30px rgba(0,0,0,.60);}}',
    '@keyframes cornerFloat{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35) drop-shadow(0 0 5px rgba(201,162,39,.5));}}',
    '@keyframes gShimmer{0%,100%{background-position:200% 0;}50%{background-position:0 0;}}',
    '@keyframes flicker{0%,100%{opacity:.78;}30%{opacity:.95;}60%{opacity:.72;}80%{opacity:.9;}}',
    '@keyframes roseSpin{from{transform:rotate(0);}to{transform:rotate(360deg);}}',
    '@keyframes gBody{from{opacity:0;}to{opacity:1;}}'].join('\n');

  var CSS_SIMPLE = PAL + [
    '.gothic-frame{position:relative;width:100%;max-width:600px;padding:40px 44px 34px;color:var(--g-text);background:linear-gradient(160deg,#14101f 0%,#0b0912 55%,#160d22 100%);border:2px solid var(--g-violet);animation:gIn .9s cubic-bezier(.2,.7,.3,1) both,gGlow 4.5s ease-in-out 1s infinite;}',
    '.gothic-frame::before{content:"";position:absolute;inset:9px;pointer-events:none;border:1px solid rgba(201,162,39,.42);box-shadow:inset 0 0 18px rgba(201,162,39,.10);}',
    '.gothic-title{text-align:center;margin:6px 0 14px;font-size:26px;letter-spacing:3px;font-weight:700;line-height:1.2;background-image:linear-gradient(90deg,var(--g-gold) 0%,var(--g-gold2) 25%,#fff3c4 50%,var(--g-gold2) 75%,var(--g-gold) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:gShimmer 5s ease-in-out 1.1s infinite;}',
    '.gothic-title::after{content:"";display:block;width:64%;height:1px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--g-gold),transparent);}',
    '.gothic-sub{text-align:center;font-size:13px;color:var(--g-dim);letter-spacing:1px;margin:-4px 0 18px;font-style:italic;animation:flicker 3.2s ease-in-out 1.4s infinite;}',
    '.gothic-body{color:var(--g-text);font-size:16px;line-height:1.8;text-align:justify;position:relative;z-index:1;animation:gBody .8s ease 0.4s both;}',
    '.gothic-body p{margin:0 0 12px;}.gothic-body h2{color:var(--g-gold2);font-size:20px;border-bottom:1px dashed var(--g-line);padding-bottom:6px;margin:20px 0 12px;}'].join('\n');

  var CSS_MAX = PAL + [
    '.gmax{position:relative;width:100%;max-width:640px;padding:46px 54px 42px;color:var(--g-text);background:linear-gradient(160deg,#1a0f24 0%,#0b0912 45%,#180d22 100%);border:2px solid var(--g-gold);box-shadow:0 0 0 5px #0b0912,0 0 0 7px var(--g-violet2),0 0 110px rgba(139,99,184,.5),inset 0 0 44px rgba(0,0,0,.75);animation:gIn .9s cubic-bezier(.2,.7,.3,1) both,gGlow 5s ease-in-out 1s infinite;}',
    '.gmax::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:radial-gradient(circle at 25% 25%,var(--g-gold) 0,transparent 1.6px),radial-gradient(circle at 75% 75%,var(--g-gold) 0,transparent 1.6px);background-size:20px 20px;}',
    '.gmax::after{content:"";position:absolute;inset:13px;pointer-events:none;border:1px solid rgba(201,162,39,.55);box-shadow:inset 0 0 0 4px #0b0912,inset 0 0 0 5px rgba(107,74,134,.6);}',
    '.gmax-side{position:absolute;top:20px;bottom:20px;width:8px;left:24px;opacity:.5;pointer-events:none;background:repeating-linear-gradient(45deg,var(--g-gold) 0 1px,transparent 1px 7px);}',
    '.gmax-side.r{left:auto;right:24px;transform:scaleX(-1);}',
    '.gmax-rose{display:flex;justify-content:center;margin:-8px 0 14px;}.gmax-rose svg{width:150px;height:150px;filter:drop-shadow(0 0 14px rgba(139,99,184,.55));animation:roseSpin 42s linear infinite;}',
    '.gmax-corner{position:absolute;width:88px;height:88px;color:var(--g-gold);pointer-events:none;filter:drop-shadow(0 0 6px rgba(201,162,39,.45));animation:cornerFloat 4s ease-in-out 0.5s infinite;}',
    '.gmax-corner svg{width:100%;height:100%;}', '.gmax-corner.tl{top:-26px;left:-26px;}.gmax-corner.tr{top:-26px;right:-26px;transform:scaleX(-1);}.gmax-corner.bl{bottom:-26px;left:-26px;transform:scaleY(-1);}.gmax-corner.br{bottom:-26px;right:-26px;transform:scale(-1,-1);}',
    '.gmax-title{text-align:center;margin:2px 0 16px;font-size:30px;letter-spacing:4px;font-weight:800;line-height:1.15;background-image:linear-gradient(90deg,var(--g-gold) 0%,var(--g-gold2) 22%,#fff3c4 50%,var(--g-gold2) 78%,var(--g-gold) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 3px 8px rgba(0,0,0,.8));animation:gShimmer 4s ease-in-out 1s infinite;}',
    '.gmax-title::after{content:"";display:block;width:84%;height:2px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--g-gold),transparent);}',
    '.gmax-sub{text-align:center;font-size:13px;color:var(--g-dim);letter-spacing:1px;margin:-6px 0 20px;font-style:italic;animation:flicker 3.2s ease-in-out 1.3s infinite;}',
    '.gmax-body{color:var(--g-text);font-size:16px;line-height:1.85;text-align:justify;position:relative;z-index:1;animation:gBody .9s ease 0.4s both;}',
    '.gmax-body p{margin:0 0 12px;}.gmax-body h2{color:var(--g-gold2);font-size:21px;border-bottom:1px double var(--g-gold);padding-bottom:6px;margin:20px 0 12px;}'].join('\n');

  var CSS_CATH = PAL + [
    '.wrap{padding:36px;}',
    '.cath{position:relative;width:100%;max-width:680px;padding:96px 74px 56px;color:var(--g-text);background:linear-gradient(180deg,#17122a 0%,#0b0912 40%,#0d0a17 100%);animation:gIn 1s cubic-bezier(.2,.7,.3,1) both;}',
    '.cath-svg{position:absolute;inset:0;pointer-events:none;}.cath-svg svg{width:100%;height:100%;display:block;}',
    '.cath-content{position:relative;z-index:2;text-align:center;}',
    '.cath-title{margin:4px 0 14px;font-size:32px;letter-spacing:5px;font-weight:800;line-height:1.12;background-image:linear-gradient(90deg,var(--g-gold) 0%,var(--g-gold2) 22%,#fff3c4 50%,var(--g-gold2) 78%,var(--g-gold) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.85));animation:gShimmer 4s ease-in-out 1s infinite;}',
    '.cath-sub{font-size:13px;color:var(--g-dim);letter-spacing:1px;margin:-6px 0 22px;font-style:italic;animation:flicker 3.2s ease-in-out 1.3s infinite;}',
    '.cath-body{font-size:16px;line-height:1.9;text-align:justify;animation:gBody .9s ease 0.4s both;}',
    '.cath-body p{margin:0 0 12px;}.cath-body h2{color:var(--g-gold2);font-size:21px;letter-spacing:1px;margin:20px 0 12px;border-bottom:1px double var(--g-gold);padding-bottom:6px;}'].join('\n');

  // ============ 满溢（压力）：密集生成，真吃性能 ============
  var CSS_MEGA = PAL + [
    '.wrap{padding:32px;}',
    '.mega{position:relative;width:100%;max-width:820px;padding:96px 60px 40px;color:var(--g-text);animation:gIn 1s cubic-bezier(.2,.7,.3,1) both;}',
    '.mega-svg{position:absolute;inset:0;pointer-events:none;}.mega-svg svg{width:100%;height:100%;display:block;}',
    '.mega-content{position:relative;z-index:3;text-align:center;margin:300px auto 0;max-width:400px;background:rgba(12,9,20,.45);backdrop-filter:blur(2px) saturate(1.1);padding:24px 28px;border:1px solid rgba(201,162,39,.3);border-radius:6px;box-shadow:0 0 44px rgba(107,74,134,.5),inset 0 0 32px rgba(0,0,0,.6);}',
    '.mega-title{margin:4px 0 16px;font-size:34px;letter-spacing:6px;font-weight:800;line-height:1.1;background-image:linear-gradient(90deg,var(--g-gold) 0%,var(--g-gold2) 22%,#fff3c4 50%,var(--g-gold2) 78%,var(--g-gold) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 3px 12px rgba(0,0,0,.9));animation:gShimmer 3.5s ease-in-out 0.6s infinite;}',
    '.mega-sub{font-size:13px;color:var(--g-dim);letter-spacing:1px;margin:-6px 0 24px;font-style:italic;animation:flicker 3s ease-in-out 1s infinite;}',
    '.mega-body{font-size:16px;line-height:1.9;text-align:justify;animation:gBody 1s ease 0.5s both;}',
    '.mega-body p{margin:0 0 12px;}.mega-body h2{color:var(--g-gold2);font-size:22px;letter-spacing:1px;margin:20px 0 12px;border-bottom:1px double var(--g-gold);padding-bottom:6px;}',
    '/* ==== 满溢压力：成百上千元素各自独立动画 ==== */',
    '@keyframes cGlow{0%,100%{fill:#6b4a86;filter:brightness(1);}50%{fill:#8a63b8;filter:brightness(1.6) drop-shadow(0 0 6px rgba(201,162,39,.8));}}',
    '@keyframes cFlick{0%,100%{opacity:.4;}15%{opacity:.95;}30%{opacity:.55;}50%{opacity:.9;}70%{opacity:.45;}85%{opacity:.85;}}',
    '.mega-svg use{animation:flicker var(--d,3.5s) ease-in-out var(--pd,0s) infinite;transform-box:fill-box;transform-origin:center;}',
    '.mega-svg use.mc{animation:cGlow var(--d,4s) ease-in-out var(--pd,0s) infinite;color:#8a63b8;}',
    '.mega-svg use.ml{animation:cFlick var(--d,3.2s) ease-in-out var(--pd,0s) infinite;}',
    '.mega-rose-spin{animation:roseSpin 26s linear infinite;transform-box:fill-box;transform-origin:center;}',
    '.mega-tower{animation:gGlow 7s ease-in-out infinite;}',
    '.mega-bg{animation:gShimmer 6s ease-in-out infinite;}',
    '/* ==== 位图混合层：精神污染极繁纹理 ==== */',
    '.mega-texture{position:absolute;inset:0;pointer-events:none;background-image:url("gothic_img/tracery_full.jpg");background-size:100% auto;background-repeat:repeat-y;background-position:center top;mix-blend-mode:darken;opacity:.98;filter:invert(1) hue-rotate(250deg) saturate(1.5) contrast(1.25) brightness(.96);}',
    '.mega-texture2{position:absolute;inset:0;pointer-events:none;background-image:url("gothic_img/tracery_full.jpg");background-size:100% auto;background-repeat:repeat-y;background-position:center top;mix-blend-mode:screen;opacity:.3;filter:invert(1) hue-rotate(205deg) saturate(1.5) contrast(1.3);}',
    '.mega-veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(6,4,10,.12) 0%,rgba(6,4,10,.5) 66%,rgba(4,2,8,.8) 100%);}',
    '.mega-svg.blend{opacity:.82;}'
  ].join('\n');

  // ---- Rich motif library (each cell is itself complex, not a simple repeat) ----
  // Symmetry is GUARANTEED: we build the centered elements + the LEFT half, then mirror the left half.
  function megaSvg(gold, violet, blue, crimson){
    var W=900, cx=450;
    var s = '<svg viewBox="0 0 '+W+' 1250" fill="none" preserveAspectRatio="none">';
    function qp(x0,y0,ax,ay,x1,y1,t){ var u=1-t; return [u*u*x0+2*u*t*ax+t*t*x1, u*u*y0+2*u*t*ay+t*t*y1]; }
    function qd(x0,y0,ax,ay,x1,y1,t){ return [2*(1-t)*(ax-x0)+2*t*(x1-ax), 2*(1-t)*(ay-y0)+2*t*(y1-ay)]; }
    var n=0; function at(cls){ n++; return ' class="'+cls+'" style="--pd:'+((n*0.11)%2.6).toFixed(2)+'s;--d:'+(2.8+((n*0.63)%3)).toFixed(2)+'s"'; }
    function crockStr(x0,y0,ax,ay,x1,y1,cnt,sc){
      var o=''; for (var i=1;i<=cnt;i++){ var t=i/(cnt+0.4); var p=qp(x0,y0,ax,ay,x1,y1,t); var d=qd(x0,y0,ax,ay,x1,y1,t);
        var ang=Math.atan2(d[1],d[0])*180/Math.PI-90;
        o += '<use href="#mCrock"'+at('mc')+' transform="translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+') rotate('+ang.toFixed(1)+') scale('+sc+')"/>'; }
      return o;
    }
    s += '<defs>';
    s += '<pattern id="mFret" width="46" height="46" patternUnits="userSpaceOnUse">'
      + '<circle cx="23" cy="23" r="16" fill="none" stroke="'+violet+'" stroke-width="0.8" opacity="0.4"/>'
      + '<path d="M0,23 C8,14 16,32 23,23 C30,14 38,32 46,23 M23,0 C14,8 32,16 23,23" fill="none" stroke="'+gold+'" stroke-width="0.7" opacity="0.42"/>'
      + '<circle cx="23" cy="23" r="3" fill="'+violet+'" opacity="0.55"/></pattern>';
    // WIN: flamboyant ogee window (symmetric) + rosette + tiny cross on the apex
    s += '<g id="mWin">'
      + '<path d="M-22,62 L-22,14 C-22,-12 -15,-28 -8,-40 C-4,-46 -1,-50 0,-48 C1,-50 4,-46 8,-40 C15,-28 22,-12 22,14 L22,62 Z" fill="#0b0814" stroke="'+gold+'" stroke-width="1.4"/>'
      + '<path d="M-16,62 L-16,14 C-16,-6 -10,-20 -4,-30 C-2,-35 0,-38 0,-36 C0,-38 2,-35 4,-30 C10,-20 16,-6 16,14 L16,62 Z" fill="none" stroke="'+violet+'" stroke-width="0.9"/>'
      + '<path d="M-8,62 C-8,22 0,6 0,-14 M8,62 C8,22 0,6 0,-14" fill="none" stroke="'+violet+'" stroke-width="0.9"/>'
      + '<circle cx="0" cy="-20" r="7.5" fill="'+violet+'" fill-opacity="0.5" stroke="'+gold+'" stroke-width="0.9"/>'
      + '<circle cx="0" cy="-20" r="2.4" fill="'+gold+'"/>'
      + '<path d="M0,-48 V-58 M-4,-53 H4" stroke="'+gold+'" stroke-width="1.2"/>'
      + '<circle cx="-13" cy="-4" r="4.5" fill="'+crimson+'" fill-opacity="0.45" stroke="'+gold+'" stroke-width="0.7"/><circle cx="13" cy="-4" r="4.5" fill="'+crimson+'" fill-opacity="0.45" stroke="'+gold+'" stroke-width="0.7"/>'
      + '<circle cx="-9" cy="36" r="3" fill="'+gold+'" opacity="0.7"/><circle cx="9" cy="36" r="3" fill="'+gold+'" opacity="0.7"/>'
      + '</g>';
    // CROCK: two curling foliage leaves (volute bud)
    s += '<g id="mCrock"><path d="M0,0 C-2,-8 2,-14 6,-16 C4,-10 6,-6 8,-2 Z" fill="'+violet+'"/>'
      + '<path d="M2,0 C6,-10 12,-16 18,-18 C15,-10 13,-4 12,2 Z" fill="'+violet+'"/>'
      + '<circle cx="7" cy="-14" r="2.5" fill="'+gold+'"/></g>';
    // ARCH: symmetric domed (kuppel) band with a small cross
    s += '<g id="mArch">'
      + '<path d="M-20,40 L-20,8 C-20,-8 -10,-16 0,-16 C10,-16 20,-8 20,8 L20,40 Z" fill="#0b0814" stroke="'+gold+'" stroke-width="1.1"/>'
      + '<path d="M-14,40 L-14,8 C-14,-4 -6,-10 0,-10 C6,-10 14,-4 14,8 L14,40 Z" fill="none" stroke="'+violet+'" stroke-width="0.85"/>'
      + '<path d="M0,-6 V-16 M-4,-11 H4" stroke="'+gold+'" stroke-width="1"/>'
      + '<path d="M-20,10 C-13,14 13,14 20,10" fill="none" stroke="'+gold+'" stroke-width="0.7" opacity="0.7"/>'
      + '</g>';
    // BISHOP: niche with mitred cleric + crozier + halo  (religious)
    s += '<g id="mBishop">'
      + '<path d="M0,-30 L16,-12 V44 H-16 V-12 Z" fill="#0c0915" stroke="'+gold+'" stroke-width="1.1"/>'
      + '<path d="M0,-22 L9,-12 V44 H-9 V-12 Z" fill="none" stroke="'+violet+'" stroke-width="0.8"/>'
      + '<path d="M-6,-14 L0,-22 L6,-14 Z" fill="'+violet+'" stroke="'+gold+'" stroke-width="0.8"/>'
      + '<circle cx="0" cy="-2" r="4.5" fill="'+gold+'" fill-opacity="0.55" stroke="'+gold+'" stroke-width="1"/>'
      + '<path d="M0,-2 V44 M-3,10 L-9,44 M3,10 L9,44" stroke="'+violet+'" stroke-width="1.1" opacity="0.85"/>'
      + '<path d="M7,-6 C14,-6 16,-14 9,-15 C4,-16 3,-10 7,-11" fill="none" stroke="'+gold+'" stroke-width="1.1"/>'
      + '</g>';
    // CROSS: latin cross finial
    s += '<g id="mCross"><path d="M0,-46 V12 M-16,-24 H16" stroke="'+gold+'" stroke-width="4" stroke-linecap="round"/>'
      + '<circle cx="0" cy="-46" r="3.4" fill="'+violet+'"/><circle cx="-16" cy="-24" r="3.4" fill="'+violet+'"/><circle cx="16" cy="-24" r="3.4" fill="'+violet+'"/><circle cx="0" cy="12" r="3.4" fill="'+violet+'"/></g>';
    // VOLUTE: spiralling S-scroll (卷边)
    s += '<g id="mVolute"><path d="M0,0 C16,-3 20,-18 8,-25 C-5,-32 -23,-23 -23,-8 C-23,7 -8,15 5,11 C15,8 17,-3 8,-6 C2,-8 -3,-4 2,-1" fill="none" stroke="'+gold+'" stroke-width="1.6"/>'
      + '<circle cx="4" cy="-2" r="2.2" fill="'+violet+'"/></g>';
    // ROOD: great crucifix — wood cross + corpus + INRI plaque  (religious centrepiece)
    s += '<g id="mRood"><path d="M0,-74 V34 M-27,-34 H27" stroke="#6a4527" stroke-width="6" stroke-linecap="round"/>'
      + '<path d="M0,-74 V34 M-27,-34 H27" stroke="'+gold+'" stroke-width="1" opacity="0.5"/>'
      + '<circle cx="0" cy="-40" r="7" fill="#e9cf7a"/><path d="M0,-33 L-16,-26 M0,-33 L16,-26 M0,-33 V16 M-5,4 L-9,16 M5,4 L9,16" stroke="#e9cf7a" stroke-width="2.4" stroke-linecap="round"/>'
      + '<rect x="-11" y="6" width="22" height="13" fill="#3b4a86" stroke="'+gold+'" stroke-width="1.2"/>'
      + '<path d="M-7,12.5 H7 M-3.5,12.5 V16" stroke="'+gold+'" stroke-width="1"/></g>';
    s += '</defs>';
    var C='', L='';   // C = centered (symmetric), L = left half (to be mirrored)
    s += '<rect class="mega-bg" width="900" height="1250" fill="#120e1d"/>';
    s += '<rect width="900" height="1250" fill="url(#mFret)" opacity="0.5"/>';
    // ---- CENTERED: gable shell + crowning rood cross + rose window + central portal ----
    var gx=450, gy=290;
    C += '<path d="M150,470 C260,300 318,200 450,104 C582,200 640,300 750,470 Z" fill="#0d0a16" stroke="'+gold+'" stroke-width="2.8"/>';
    C += '<path d="M180,470 C280,318 328,218 450,132 C572,218 620,318 720,470 Z" fill="none" stroke="'+violet+'" stroke-width="1.4" opacity="0.9"/>';
    // crowning rood cross standing on the gable apex (clear, not overlapping the rose)
    C += '<use href="#mRood" transform="translate('+gx+' 150) scale(1.7)"/>';
    var rings=[128,99,70,42], ringCol=[gold,violet,gold,violet];
    C += '<g class="mega-rose-spin">';
    for (var ri=0; ri<4; ri++){ C += '<circle cx="'+gx+'" cy="'+gy+'" r="'+rings[ri]+'" fill="'+(ri===3?blue:'#0c0915')+'" fill-opacity="0.5" stroke="'+ringCol[ri]+'" stroke-width="1.8"/>'; }
    C += '<circle cx="'+gx+'" cy="'+gy+'" r="20" fill="'+crimson+'" fill-opacity="0.5" stroke="'+gold+'" stroke-width="1.6"/>';
    for (var p=0;p<64;p++){ var a=p/64*2*Math.PI; var rx=gx+Math.cos(a)*128,ry=gy+Math.sin(a)*128;
      C += '<line x1="'+gx+'" y1="'+gy+'" x2="'+rx+'" y2="'+ry+'" stroke="'+gold+'" stroke-width="0.9"/>';
      for (var ri2=1;ri2<4;ri2++){ var q=(p+0.5)/64*2*Math.PI; var rr=rings[ri2];
        C += '<circle cx="'+(gx+Math.cos(q)*rr)+'" cy="'+(gy+Math.sin(q)*rr)+'" r="'+(ri2===1?7:ri2===2?4:2.4)+'" fill="none" stroke="'+(ri2%2?violet:gold)+'" stroke-width="0.8" opacity="0.9"/>'; } }
    // cross-in-wheel hub (religious)
    C += '<path d="M'+gx+','+(gy-16)+' V'+(gy+16)+' M'+(gx-14)+','+gy+' H'+(gx+14)+'" stroke="'+gold+'" stroke-width="3" stroke-linecap="round"/>';
    C += '</g>';
    for (var po=0;po<3;po++){ var pw=120+po*26;
      C += '<path d="M'+(gx-pw)+',560 A'+pw+','+(pw+14)+' 0 0 1 '+gx+',406 A'+pw+','+(pw+14)+' 0 0 1 '+(gx+pw)+',560 L'+(gx+pw)+',660 L'+(gx-pw)+',660 Z" fill="'+(po===0?'#0c0915':'none')+'" stroke="'+(po===2?violet:gold)+'" stroke-width="'+(po===2?2:1.4)+'"/>'; }
    C += '<use href="#mBishop"'+at('ml')+' transform="translate('+gx+' 574) scale(1.3)"/>';
    // ---- LEFT HALF (mirrored to make the right half) ----
    var tx=24;
    L += '<rect class="mega-tower" x="'+tx+'" y="120" width="236" height="940" fill="#0d0a16" stroke="'+violet+'" stroke-width="2.6"/>';
    L += '<rect x="'+(tx+6)+'" y="126" width="224" height="928" fill="none" stroke="'+gold+'" stroke-width="0.9" opacity="0.4"/>';
    for (var col=0; col<2; col++){ var wx=tx+62+col*112; for (var r=0;r<11;r++){ L += '<use href="#mWin"'+at(col?'mc':'ml')+' transform="translate('+(wx-20)+' '+(150+r*82)+')"/>'; } }
    for (var tf=0; tf<5; tf++){ var fy=176+tf*184; for (var fa=0; fa<2; fa++){ L += '<use href="#mArch"'+at('ml')+' transform="translate('+(tx+34+fa*84)+' '+fy+') scale(1.1)"/>'; } }
    for (var pe=0; pe<14; pe++){ var py=150+pe*62; L += '<use href="#mCrock"'+at('mc')+' transform="translate('+(tx-4)+' '+py+') scale(1.1)"/>'; L += '<use href="#mCrock"'+at('mc')+' transform="translate('+(tx+236)+' '+py+') scale(1.1)"/>'; }
    for (var nn=0; nn<4; nn++){ L += '<use href="#mBishop"'+at('ml')+' transform="translate('+(tx+118)+' '+(424+nn*232)+')"/>'; }
    // volute scrolls flanking the tower base (卷边)
    L += '<use href="#mVolute"'+at('mc')+' transform="translate('+(tx+16)+' 148) scale(1.3) scale(-1,1)"/>';
    L += '<use href="#mVolute"'+at('mc')+' transform="translate('+(tx+220)+' 148) scale(1.3)"/>';
    // concave crocketed spire + cross finial + openwork windows + edge crockets
    L += '<path d="M'+tx+',120 C'+(tx+66)+',40 '+(tx+100)+',-24 '+(tx+118)+',-78 C'+(tx+136)+',-24 '+(tx+170)+',40 '+(tx+236)+',120 Z" fill="#0d0a16" stroke="'+gold+'" stroke-width="2.2"/>';
    L += '<path d="M'+(tx+118)+',-78 C'+(tx+100)+',-24 '+(tx+66)+',40 '+(tx+118)+',120" stroke="'+gold+'" stroke-width="1" opacity="0.7"/>';
    for (var sp=0;sp<6;sp++){ var spt=(sp+1)/6.6; var sy2=120-190*spt; var half=110*spt;
      L += '<use href="#mWin"'+at('ml')+' transform="translate('+(tx+118-half)+' '+sy2+') scale(0.5)"/>';
      L += '<use href="#mWin"'+at('mc')+' transform="translate('+(tx+118+half)+' '+sy2+') scale(0.5)"/>'; }
    L += crockStr(tx+2,112, tx+66,44, tx+118,-72, 5, 0.85);
    L += crockStr(tx+234,112, tx+170,44, tx+118,-72, 5, 0.85);
    L += '<use href="#mCross"'+at('mc')+' transform="translate('+(tx+118)+' -86) scale(1.6)"/>';
    L += '<circle cx="'+(tx+118)+'" cy="-84" r="3" fill="'+crimson+'" opacity="0.9"/>';
    // volute scrolls flanking the tower base (卷边) — enlarged
    L += '<use href="#mVolute"'+at('mc')+' transform="translate('+(tx+16)+' 156) scale(1.8) scale(-1,1)"/>';
    L += '<use href="#mVolute"'+at('mc')+' transform="translate('+(tx+220)+' 156) scale(1.8)"/>';
    // volute scrolls at the tower shoulders (卷边)
    L += '<use href="#mVolute"'+at('mc')+' transform="translate('+(tx+8)+' 300) scale(1.5) scale(-1,1)"/>';
    L += '<use href="#mVolute"'+at('mc')+' transform="translate('+(tx+228)+' 300) scale(1.5)"/>';
    // left gable crocket runs (up to apex)
    L += crockStr(150,470, 260,300, 450,104, 10, 1.0);
    L += crockStr(180,470, 280,318, 450,132, 10, 0.8);
    // volute scrolls on the gable shoulders (卷边, mirrored pair)
    L += '<use href="#mVolute"'+at('mc')+' transform="translate(150 470) scale(2.1) rotate(-90) scale(-1,1)"/>';
    L += '<use href="#mVolute"'+at('mc')+' transform="translate(214 388) scale(1.7) rotate(-30)"/>';
    // left portal-flanking bishops + volutes
    for (var nn2=0;nn2<2;nn2++){ var nx=gx-150-nn2*92; L += '<use href="#mBishop"'+at('ml')+' transform="translate('+nx+' 576)"/>'; }
    L += '<use href="#mVolute"'+at('mc')+' transform="translate(206 470) scale(1.7) rotate(90) scale(-1,1)"/>';
    // left nave arches + crockets (mirrored pair around centre)
    for (var nb=0;nb<4;nb++){ var nx2=150+nb*96; L += '<use href="#mArch"'+at('ml')+' transform="translate('+(nx2+16)+' 760) scale(1.6)"/>'; L += '<use href="#mCrock"'+at('mc')+' transform="translate('+nx2+' 758) scale(1.2)"/>'; }
    // central nave arch at the axis
    C += '<use href="#mArch"'+at('ml')+' transform="translate('+gx+' 760) scale(1.6)"/>';
    // left flying buttresses
    for (var fbi=0; fbi<3; fbi++){ var fy=560+fbi*92;
      L += '<path d="M34,'+fy+' C100,'+(fy-26)+' 160,'+(fy+6)+' 172,'+(fy+38)+' C166,'+(fy+55)+' 150,'+(fy+58)+' 130,'+(fy+64)+' C86,'+(fy+50)+' 34,'+(fy+90)+' 34,'+(fy+90)+' Z" fill="#100c1a" stroke="'+violet+'" stroke-width="1.5"/>';
      L += '<path d="M34,'+(fy+30)+' C80,'+(fy+34)+' 34,'+(fy+52)+' 100,'+(fy+58)+'" fill="none" stroke="'+gold+'" stroke-width="0.8" opacity="0.7"/>';
      L += '<use href="#mCrock"'+at('mc')+' transform="translate(172 '+(fy+4)+') scale(1.15)"/>'; }
    // ---- compose: centered + left + mirrored(left) == symmetric by construction ----
    s += C + L + '<g transform="translate('+W+' 0) scale(-1 1)">'+L+'</g>';
    s += '</svg>';
    return s;
  }

  function gothicFrame(content, opts){ var gold=opts.accent||'#c9a227',violet=opts.violet||'#6b4a86';
    var t=opts.title?'<div class="gothic-title">'+opts.title+'</div>':'';var sb=opts.subtitle?'<div class="gothic-sub">'+opts.subtitle+'</div>':'';
    return doc('<div class="gothic-frame" style="--g-gold:'+gold+';--g-violet:'+violet+'">'+t+sb+'<div class="gothic-body">'+content+'</div></div>',CSS_SIMPLE); }
  function gothicMax(content, opts){ var gold=opts.accent||'#c9a227',violet=opts.violet||'#6b4a86';var c=smallFleur(gold);
    var corners='<span class="gmax-corner tl">'+c+'</span><span class="gmax-corner tr">'+c+'</span><span class="gmax-corner bl">'+c+'</span><span class="gmax-corner br">'+c+'</span>';
    var frame='<div class="gmax" style="--g-gold:'+gold+';--g-violet:'+violet+'">'+corners+'<div class="gmax-rose">'+roseSvg(150,gold,violet)+'</div><span class="gmax-side"></span><span class="gmax-side r"></span>'+opts.title+'</div>';
    return doc(frame, CSS_MAX); }
  function gothicCathedral(content, opts){ var gold=opts.accent||'#c9a227',violet=opts.violet||'#6b4a86';
    var t=opts.title?'<div class="cath-title">'+opts.title+'</div>':'';var sb=opts.subtitle?'<div class="cath-sub">'+opts.subtitle+'</div>':'';
    return doc('<div class="cath" style="--g-gold:'+gold+';--g-violet:'+violet+'"><div class="cath-svg">'+cathedralSvg(gold,violet,'#3b4a86','#8a2f45')+'</div><div class="cath-content">'+t+sb+'<div class="cath-body">'+content+'</div></div></div>',CSS_CATH); }
  // 满溢：给大量元素挂动画（性能压力）+ 内容盖在正中
  function gothicMega(content, opts){ var gold=opts.accent||'#c9a227',violet=opts.violet||'#6b4a86';
    var t=opts.title?'<div class="mega-title a-shim">'+opts.title+'</div>':'';var sb=opts.subtitle?'<div class="mega-sub a-flick">'+opts.subtitle+'</div>':'';
    return doc('<div class="mega" style="--g-gold:'+gold+';--g-violet:'+violet+'"><div class="mega-svg">'+megaSvg(gold,violet,'#3b4a86','#8a2f45')+'</div><div class="mega-content">'+t+sb+'<div class="mega-body">'+content+'</div></div></div>',CSS_MEGA); }
  // 糅合（精神污染极繁）：公有领域位图纹理层 + 对称 SVG 构架层 + 暗色字卡
  function gothicBlend(content, opts){ var gold=opts.accent||'#c9a227',violet=opts.violet||'#6b4a86';
    var t=opts.title?'<div class="mega-title a-shim">'+opts.title+'</div>':'';var sb=opts.subtitle?'<div class="mega-sub a-flick">'+opts.subtitle+'</div>':'';
    return doc('<div class="mega" style="--g-gold:'+gold+';--g-violet:'+violet+'">'
      +'<div class="mega-texture"></div><div class="mega-texture2"></div>'
      +'<div class="mega-svg blend">'+megaSvg(gold,violet,'#3b4a86','#8a2f45')+'</div>'
      +'<div class="mega-veil"></div>'
      +'<div class="mega-content">'+t+sb+'<div class="mega-body">'+content+'</div></div></div>',CSS_MEGA); }

  function doc(frame, css){ return '<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>'+css+'</style></head><body><div class="wrap">'+frame+'</div></body></html>'; }
  function smallFleur(gold){ return '<svg viewBox="0 0 44 44" fill="none"><path d="M22,4 C24,10 28,12 30,18 C30,22 26,24 22,24 C18,24 14,22 14,18 C16,12 20,10 22,4 Z" fill="'+gold+'" fill-opacity="0.92"/><path d="M22,24 C22,30 18,34 18,40 L26,40 C26,34 22,30 22,24 Z" fill="'+gold+'" fill-opacity="0.92"/><circle cx="22" cy="16" r="2.6" fill="#0b0912"/></svg>'; }
  function roseSvg(size,gold,violet){ var s='<svg viewBox="0 0 200 200" width="'+size+'" height="'+size+'" fill="none">';
    s+='<circle cx="100" cy="100" r="96" fill="'+violet+'" fill-opacity="0.12" stroke="'+gold+'" stroke-width="3"/><circle cx="100" cy="100" r="74" stroke="'+violet+'" stroke-width="1.8"/><circle cx="100" cy="100" r="48" stroke="'+gold+'" stroke-width="1.8"/><circle cx="100" cy="100" r="22" fill="'+gold+'" fill-opacity="0.28" stroke="'+gold+'" stroke-width="1.8"/>';
    for (var i=0;i<16;i++){ var a=i/16*2*Math.PI; s+='<line x1="'+(100+Math.cos(a)*22)+'" y1="'+(100+Math.sin(a)*22)+'" x2="'+(100+Math.cos(a)*96)+'" y2="'+(100+Math.sin(a)*96)+'" stroke="'+gold+'" stroke-width="1.2"/><line x1="'+(100+Math.cos((i+0.5)/16*2*Math.PI)*48)+'" y1="'+(100+Math.sin((i+0.5)/16*2*Math.PI)*48)+'" x2="'+(100+Math.cos((i+0.5)/16*2*Math.PI)*74)+'" y2="'+(100+Math.sin((i+0.5)/16*2*Math.PI)*74)+'" stroke="'+violet+'" stroke-width="0.9" opacity="0.8"/>'; }
    return s+'</svg>'; }
  function cathedralSvg(gold, violet, blue, crimson){ var s='<svg viewBox="0 0 680 840" fill="none">';
    s+='<defs><pattern id="stone" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#14101b"/><path d="M0,18 H36 M18,0 V36" stroke="#1d1830" stroke-width="1"/></pattern><pattern id="trac" width="34" height="46" patternUnits="userSpaceOnUse"><path d="M17,4 L30,20 V42 H4 V20 Z" fill="none" stroke="'+violet+'" stroke-width="1" opacity="0.5"/><circle cx="17" cy="20" r="7" fill="none" stroke="'+gold+'" stroke-width="0.8" opacity="0.55"/></pattern><g id="pinn"><path d="M0,0 L9,-26 L18,0 Z" fill="'+violet+'"/><rect x="4" y="0" width="10" height="8" fill="'+gold+'" opacity="0.5"/></g></defs>';
    s+='<rect width="680" height="840" fill="url(#stone)"/><rect width="680" height="840" fill="url(#trac)" opacity="0.6"/>';
    s+='<path d="M40,120 C150,160 180,300 160,470 L120,470 C130,320 90,180 40,150 Z" fill="#120e1e" stroke="'+violet+'" stroke-width="1.4"/><path d="M640,120 C530,160 500,300 520,470 L560,470 C550,320 590,180 640,150 Z" fill="#120e1e" stroke="'+violet+'" stroke-width="1.4"/>';
    s+='<use href="#pinn" x="26" y="96" transform="scale(1.2)"/><use href="#pinn" x="640" y="96" transform="scale(1.2)"/>';
    s+='<path d="M120,470 L120,250 C200,120 480,120 560,250 L560,470 L120,470 Z" fill="#0c0915" stroke="'+gold+'" stroke-width="2.4"/><path d="M138,470 L138,258 C208,140 472,140 542,258 L542,470" fill="none" stroke="'+violet+'" stroke-width="1.6"/><path d="M200,470 L200,236 M340,470 L340,210 M480,470 L480,236" stroke="'+violet+'" stroke-width="1.2" opacity="0.8"/><path d="M200,236 C280,180 400,180 480,236 M200,470 C280,400 400,400 480,470" stroke="'+violet+'" stroke-width="1" opacity="0.7" fill="none"/>';
    var rx=340,ry=180,R=110; s+='<circle cx="'+rx+'" cy="'+ry+'" r="'+R+'" fill="'+blue+'" fill-opacity="0.4" stroke="'+gold+'" stroke-width="3"/><circle cx="'+rx+'" cy="'+ry+'" r="'+(R-16)+'" fill="none" stroke="'+crimson+'" stroke-width="1.6" opacity="0.8"/><circle cx="'+rx+'" cy="'+ry+'" r="'+(R-38)+'" fill="none" stroke="'+gold+'" stroke-width="1.6"/><circle cx="'+rx+'" cy="'+ry+'" r="24" fill="'+violet+'" fill-opacity="0.5" stroke="'+gold+'" stroke-width="1.6"/>';
    for (var i=0;i<24;i++){ var a=i/24*2*Math.PI; var ax=rx+Math.cos(a)*R,ay=ry+Math.sin(a)*R,bx=rx+Math.cos(a)*24,by=ry+Math.sin(a)*24; s+='<line x1="'+bx+'" y1="'+by+'" x2="'+ax+'" y2="'+ay+'" stroke="'+gold+'" stroke-width="1.1"/><line x1="'+(rx+Math.cos((i+0.5)/24*2*Math.PI)*(R-38))+'" y1="'+(ry+Math.sin((i+0.5)/24*2*Math.PI)*(R-38))+'" x2="'+(rx+Math.cos((i+0.5)/24*2*Math.PI)*(R-16))+'" y2="'+(ry+Math.sin((i+0.5)/24*2*Math.PI)*(R-16))+'" stroke="'+crimson+'" stroke-width="0.8" opacity="0.8"/>'; }
    s+='<path d="M28,180 L60,-10 L92,180 Z" fill="'+violet+'" stroke="'+gold+'" stroke-width="1.8"/><path d="M28,180 H92 V210 H28 Z" fill="#0c0915" stroke="'+gold+'" stroke-width="1.4"/><path d="M588,180 L620,-10 L652,180 Z" fill="'+violet+'" stroke="'+gold+'" stroke-width="1.8"/><path d="M588,180 H652 V210 H588 Z" fill="#0c0915" stroke="'+gold+'" stroke-width="1.4"/><use href="#pinn" x="52" y="196"/><use href="#pinn" x="612" y="196"/>';
    s+='<rect x="120" y="470" width="440" height="26" fill="#0c0915" stroke="'+gold+'" stroke-width="2"/>';
    for (var x=140; x<560; x+=60){ s+='<circle cx="'+x+'" cy="483" r="5" fill="'+gold+'" opacity="0.6"/>'; }

  var bodyContent = '<h2>序章 · 月下的邀约</h2><p>夜色如墨，教堂尖顶在穹顶之下投下长长的影子。她提着裙摆，沿着石阶缓步走下，指尖拂过斑驳的石栏。</p><p>风穿过彩绘玫瑰窗，碎金般的光在她脚边铺开。你知道，这一夜注定不会平静。</p>';
  var opts = { title:'暗夜圣洁 · DICK', subtitle:'A Gothic Tale', accent:'#c9a227', violet:'#6b4a86' };
  var fr = document.getElementById('demoFrame');
  var kinds = { simple:gothicFrame, max:gothicMax, cathedral:gothicCathedral, mega:gothicMega, blend:gothicBlend };
  var btns = { simple:'bSimple', max:'bMax', cathedral:'bCathedral', mega:'bMega', blend:'bBlend' };
  function show(kind){ fr.srcdoc = kinds[kind](bodyContent, opts); Object.keys(btns).forEach(function(k){ document.getElementById(btns[k]).className = (k===kind)?'on':''; }); }
  Object.keys(btns).forEach(function(k){ document.getElementById(btns[k]).onclick=function(){ show(k); }; });
  show('blend');
</script>
